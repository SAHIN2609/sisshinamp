name: Build SishhinDSP VST3 and Standalone
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: macos-15
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate embedded HTML and JavaScript
        shell: bash
        run: python tools/validate_web_ui.py
      - name: Generate high-resolution cabinet and room IR bank
        shell: bash
        run: python tools/generate_ir_bank.py --dest build/GeneratedIR --full
      - name: Install Windows WebView2 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "${{ github.workspace }}/webview2-nuget" -NonInteractive
      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDSP_BUILD_PLUGIN=ON -DSDSP_BUILD_TESTS=ON -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$GITHUB_WORKSPACE/webview2-nuget"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDSP_BUILD_PLUGIN=ON -DSDSP_BUILD_TESTS=ON
          fi
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 3
      - name: Run DSP Tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage VST3 with full usable IR library (100+ MiB)
        shell: bash
        run: |
          set -e
          mkdir -p dist/VST3 dist/Standalone
          vst3_dir="$(find build/SishhinDSP_artefacts -type d -name 'SishhinDSP.vst3' | head -n1)"
          if [[ -z "$vst3_dir" ]]; then
            echo "::error::The VST3 build output is missing"
            exit 1
          fi
          mkdir -p "$vst3_dir/Contents/Resources/CabinetIRLibrary"
          cp build/GeneratedIR/CabinetIRLibrary/*.wav "$vst3_dir/Contents/Resources/CabinetIRLibrary/"
          cp build/GeneratedIR/manifest.json "$vst3_dir/Contents/Resources/CabinetIRLibrary/"
          cp -R "$vst3_dir" dist/VST3/
          for candidate in build/SishhinDSP_artefacts/Release/Standalone build/SishhinDSP_artefacts/Standalone; do
            if [[ -d "$candidate" ]]; then
              cp -R "$candidate/." dist/Standalone/
            fi
          done
          python - <<'PY'
          from pathlib import Path
          bundles=list(Path("dist/VST3").glob("*.vst3"))
          assert len(bundles)==1, f"Expected one plugin bundle, got {bundles}"
          plugin=bundles[0]
          bank=plugin/"Contents"/"Resources"/"CabinetIRLibrary"
          recordings=list(bank.glob("*.wav"))
          assert len(recordings)==72, f"Only {len(recordings)} cabinet/room WAVs bundled"
          installed_size=sum(p.stat().st_size for p in plugin.rglob("*") if p.is_file())
          assert installed_size > 100*1024*1024, f"Plugin is only {installed_size} bytes"
          print(f"{plugin}: {installed_size/1048576:.1f} MiB installed")
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: SishhinDSP-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
