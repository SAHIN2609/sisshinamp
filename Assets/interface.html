<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SishhinDSP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Yuji+Boku&display=swap">
<style>
:root{--page:#efece6;--cap:#6a7086;--cu:#c8312b;--sg:radial-gradient(circle at 50% 100%,#0000 0 30%,#aab6d444 31% 33%,#0000 34% 48%,#aab6d444 49% 51%,#0000 52% 64%,#aab6d444 65% 67%,#0000 68%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#15171d;--cap:#9aa0b4}}
:root[data-theme="dark"]{--page:#15171d;--cap:#9aa0b4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font:500 12px Inter,system-ui,sans-serif;padding:12px}
.win{max-width:1060px;margin:0 auto;border-radius:12px;background:linear-gradient(180deg,#f1eee8,#fbfaf7 50%,#eeebe3);box-shadow:0 20px 50px -20px #0007;color:#2b3040;overflow:hidden}
.tb{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;font-size:11px;font-weight:700;color:#555}
.tb span{margin:0 auto}
.tabs{display:flex;justify-content:center;gap:34px;padding:6px 0}
.tabs button{background:none;border:0;color:#3c4254;opacity:.55;position:relative;padding:4px 4px 10px;cursor:pointer}
.tabs button.on{opacity:1}.tabs button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#2b3040}
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:12px 8px;padding:10px 14px;border-bottom:1px solid #0000000d}
.grp{display:flex;align-items:flex-end;gap:10px;padding:0 16px;border-right:1px solid #0000001a}.grp:last-child{border:0}
.kc{display:flex;flex-direction:column;align-items:center;gap:4px}
.kc b{font-size:9px;letter-spacing:.08em;color:#4b5266;white-space:nowrap}
.kc output{font-size:10px;color:#7b8197;min-height:12px}
.knob{--a:0deg;--s:40px;width:var(--s);height:var(--s);border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;background:radial-gradient(circle at 35% 30%,#fff,#e6e8f0 65%,#c6cad8);box-shadow:0 3px 6px #0000004d,inset 0 -2px 3px #0002}
.knob::after{content:"";position:absolute;left:50%;top:9%;width:2px;height:26%;margin-left:-1px;border-radius:1px;background:var(--cu);transform-origin:50% 150%;transform:rotate(var(--a))}
.bar .knob{--s:46px}
.tg{display:inline-block;width:18px;height:10px;border-radius:6px;background:#c3c7d6;position:relative;vertical-align:-1px;cursor:pointer}
.tg::after{content:"";position:absolute;top:1px;left:1px;width:8px;height:8px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--cu)}.tg.on::after{left:9px}
.md{display:flex;align-items:center;gap:7px;background:none;border:0;font:700 9px Inter;color:#9096ab;cursor:pointer;padding:14px 0}
.md u{width:24px;height:12px;border-radius:7px;background:#c9ccd9;position:relative}
.md u::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:#fff;transition:.2s}
.md[data-m=stereo] u::after{left:14px}
.md[data-m=mono] span:last-child,.md[data-m=stereo] span:nth-child(2){color:#2b3040}
.pre{flex:1 1 340px;max-width:430px;flex-direction:column;align-items:stretch;gap:6px}
.nav{display:flex;gap:4px;align-items:center}
.nav button{background:none;border:0;font:700 9px Inter;letter-spacing:.06em;color:#6a7086;cursor:pointer;padding:3px 6px}
.nav button:hover{color:#2b3040}.nav #pv,.nav #nx{font-size:14px}#sv{color:#3a7a48}#sa{color:#2b3a66}#dl{color:var(--cu)}
.pre select,.pre input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #0000001a;background:#ffffffd9;font:600 12px Inter;color:#2b3040}
#view{padding:20px 16px 10px;min-height:720px;background:var(--sg) 0 0/48px 24px,var(--sg) 24px 12px/48px 24px}
.amp{position:relative;max-width:820px;margin:26px auto 10px;border-radius:18px;padding:10px 0 0}
.handle{position:absolute;left:5%;right:5%;top:-16px;height:22px;border-top:7px solid var(--cu);border-radius:50% 50% 0 0/22px 22px 0 0}
.a0{background:linear-gradient(#fffdf9,#e6e0d4);box-shadow:0 22px 30px -14px #3a4060aa,inset 0 0 0 2px #fff}
.a1{background:linear-gradient(#222845,#0a0d18);box-shadow:0 22px 30px -14px #000a}
.a2{background:linear-gradient(#2c4630,#0f180f);box-shadow:0 22px 30px -14px #000a}
.face{position:relative;aspect-ratio:4.4/1;border-radius:12px 12px 0 0;overflow:hidden;margin:0 12px}
.a0 .face{background:linear-gradient(#fbf8f1,#ece6d9);box-shadow:inset 0 0 0 1px #0000000f}
.a1 .face{background:linear-gradient(#141a33,#05070f)}
.a2 .face{background:radial-gradient(ellipse at 70% 100%,#e9b45a 0,#4a5a2c 35%,#122015 80%)}
.face svg{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;z-index:2;display:flex;flex-direction:column;gap:2px}
.logo .jp{font:clamp(22px,4.8vw,46px)/1 'Yuji Boku','Hiragino Mincho ProN','Yu Mincho',serif}
.logo small{font-size:8px;letter-spacing:.42em;font-weight:700;margin-top:4px}.lm{display:block;width:clamp(70px,15vw,150px);aspect-ratio:2.5;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}@keyframes fl{to{stroke-dashoffset:-34}}
.logo img{display:block;max-height:clamp(30px,7vw,72px);max-width:34vw}
.a0 .logo{left:6%;top:50%;transform:translateY(-50%);color:#16161a}
.a1 .logo{left:6%;top:50%;transform:translateY(-50%);color:#f4f7ff;filter:drop-shadow(0 0 8px #6fb3ff)}
.a2 .logo{left:6%;top:50%;transform:translateY(-50%);color:#f4ecd0;filter:drop-shadow(0 2px 6px #000a)}
.strip{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px 16px 14px}
.strip .knob{--s:clamp(24px,4.6vw,40px)}
.strip .kc b{font-size:clamp(5px,1vw,8px);color:#6a7086}.strip output{display:none}
.a1 .kc b,.a2 .kc b,.a1 .jack+.vc b,.a1 .vc b,.a2 .vc b,.a1 .pw b,.a2 .pw b{color:#aab0c0}
.a1 .knob,.a2 .knob,.ped .knob{background:radial-gradient(circle at 35% 30%,#5b5f6b,#1b1d23 70%,#0b0c0f);box-shadow:0 3px 6px #0008,inset 0 1px 2px #fff3}
.a1 .knob::after,.a2 .knob::after,.ped .knob::after{background:#fff}
.jack{width:18px;height:18px;border-radius:50%;background:radial-gradient(#222 35%,#9a9ead 38%,#555);flex:none}
.vc,.pw{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none}
.vc b,.pw b{font-size:clamp(5px,1vw,8px);letter-spacing:.08em;color:#6a7086}
.vc u{width:10px;height:20px;border-radius:5px;background:#9a9ead;position:relative;cursor:pointer}
.vc u::after{content:"";position:absolute;left:1px;top:1px;width:8px;height:8px;border-radius:50%;background:#fff;transition:.2s}
.vc.on u::after{top:11px}
.pw u{width:16px;height:22px;border-radius:4px;background:linear-gradient(#ffb27d,#e0743a);box-shadow:0 0 10px #e0743a88}
.sel3{display:flex;justify-content:center;gap:12px;margin:30px 0 6px;flex-wrap:wrap}
.sel3 button{background:#ffffff80;border:2px solid transparent;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:700 10px Inter;color:#2b3040}
.sel3 button.on{border-color:var(--cu);background:#fff}.sel3 small{font-size:8px;letter-spacing:.14em;color:#7b8197}
.mini{display:block;width:80px;height:26px;border-radius:5px}
.m0{background:linear-gradient(#fff,#f4c4d1)}.m1{background:linear-gradient(90deg,#10172e 38%,#e8f0ff 40% 60%,#10172e 62%)}
.m2{background:repeating-linear-gradient(90deg,#1a2e1c 0 4px,#79b873 4px 8px)}
.cg{display:grid;grid-template-columns:minmax(150px,230px) 1fr minmax(150px,230px);gap:18px;align-items:start}
.cc{display:flex;flex-direction:column;gap:12px}.cm{min-width:0}
.mn{display:flex;gap:6px}.mn button{background:none;border:0;font-size:16px;color:#4b5266;cursor:pointer}
.msel{display:flex;border-radius:10px;overflow:hidden;background:#ffffffb3}
.msel select{flex:1;min-width:0;border:0;background:none;padding:10px;font:600 12px Inter;color:#2b3040}
.pwr{border:0;border-left:1px solid #0001;background:none;width:38px;font-size:15px;color:#9aa0b4;cursor:pointer}.pwr.on{color:#3a7a48}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:14px 6px;justify-items:center}.mk .knob,.rs .knob{--s:52px}
.rs{border-top:1px solid #0001;padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:8px}.rs>b{font-size:10px;letter-spacing:.08em;color:#4b5266}
.mh{max-width:100%;margin:22px auto 0;padding:10px 0 8px}.mh .face{margin:0 10px}.mh .lm{width:clamp(50px,9vw,90px)}
.st{display:flex;justify-content:space-around;padding:8px 14px 2px}.st i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c6cad8)}.a1 .st i,.a2 .st i{background:radial-gradient(circle at 35% 30%,#5b5f6b,#0b0c0f)}
.cabx{display:grid;gap:5%;padding:5%;border-radius:16px;margin:-2px auto 0;border:3px solid #0001}
.cx0{width:52%;grid-template-columns:1fr}.cx1,.cx2{width:84%;grid-template-columns:1fr 1fr}
.sp{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c9c3b6 0 14%,#ebe6da 15% 40%,#d6d0c2 41% 55%,#f4f0e7 56% 70%,#c4bead 71%);box-shadow:inset 0 0 0 6px #fff9,0 4px 8px #0005}
.a1 .sp,.a2 .sp{background:radial-gradient(circle,#4a4d57 0 14%,#26282e 15% 58%,#0f1013 60%);box-shadow:0 4px 8px #0008}
.mic{position:absolute;width:44%;height:11%;border-radius:5px;background:linear-gradient(#555,#111);box-shadow:0 3px 5px #0007}
.cts{display:flex;justify-content:center;gap:10px;margin:14px 0}
.ctb{background:#ffffffb3;border:2px solid transparent;border-radius:8px;padding:6px 12px;font:700 11px Inter;color:#2b3040;cursor:pointer;display:flex;flex-direction:column;align-items:center}.ctb small{font-size:8px;letter-spacing:.14em;color:#7b8197}.ctb.on{border-color:var(--cu);background:#fff}
@media(max-width:760px){.cg{grid-template-columns:1fr}.cm{order:-1}}






.row{display:flex;justify-content:center;gap:34px}.row .knob{--s:48px}
.peds{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:6px}
.ped{width:176px;padding:16px 14px 16px;border-radius:14px;color:#fff;text-align:center;box-shadow:0 14px 20px -10px #0009,inset 0 1px 0 #fff4}
.ped .pk{display:grid;grid-template-columns:1fr 1fr;gap:10px 6px;justify-items:center}.pk .kc:nth-child(3){grid-column:1/-1}
.ped .kc b{color:#ffffffd0}.ped .kc output{display:none}
.ped h4{margin:12px 0 2px;letter-spacing:.16em;font-size:13px}.ped small{font-size:8px;letter-spacing:.14em;opacity:.8}
.p0{background:linear-gradient(#f8dfe6,#dfaebd);color:#2b3040}.p0 .kc b{color:#2b3040}
.p1{background:linear-gradient(#2b3a66,#10172e)}.p2{background:linear-gradient(#d7c9a6,#a89a74);color:#2b3040}.p2 .kc b{color:#2b3040}
.p3{background:linear-gradient(#7fae78,#3a6240)}.p4{background:linear-gradient(#86a9c4,#44698a)}
.fs{display:block;margin:12px auto 0;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#eceef4,#7d8292);box-shadow:0 4px 8px #0006}
.led{display:block;width:8px;height:8px;border-radius:50%;background:#59606f;margin:10px auto 0}
.fs.on+.led,.led.on{background:#7cc0ff;box-shadow:0 0 10px #4aa8ff}
.eq{max-width:720px;margin:14px auto;background:linear-gradient(#fbfbfd,#d9dce5);border-radius:12px;padding:16px 26px 20px;box-shadow:0 16px 24px -12px #3a4060aa,inset 0 0 0 2px #fff}
.eqh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:10px;letter-spacing:.12em;color:#4b5266;margin-bottom:10px}
.eqh button{border:1px solid #0002;background:#fff;border-radius:6px;font:700 9px Inter;letter-spacing:.08em;padding:5px 9px;cursor:pointer;margin-left:6px}
.eqh button.on{background:#3a7a48;color:#fff;border-color:#3a7a48}#eqr{background:#2b3a66;color:#fff;border-color:#2b3a66}
.ir{max-width:720px;margin:18px auto 4px;background:linear-gradient(#fffdf9,#e6e0d4);border-radius:12px;padding:14px 22px 16px;box-shadow:0 14px 22px -12px #3a4060aa,inset 0 0 0 2px #fff}.ir canvas{width:100%;height:70px;display:block;background:#0000000a;border-radius:8px}.irm{font-size:10px;color:#6a7086;margin:8px 0 12px;text-align:center}.ir .row{gap:44px}.irm{overflow-wrap:anywhere}.ir .eqh button{transition:.15s}.ir .eqh button:disabled{opacity:.4;cursor:default}#irl{background:var(--cu);color:#fff;border-color:var(--cu)}#irx{background:#2b3a66;color:#fff;border-color:#2b3a66}.ir [data-t=ir].on{background:#3a7a48;border-color:#3a7a48;color:#fff}
.bands{display:flex;justify-content:space-between}
.bands label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9px;font-weight:700;color:#5a6075}
.bands output{font-size:9px;color:#8a90a5}
.bands input{writing-mode:vertical-lr;direction:rtl;height:150px;width:24px;accent-color:var(--cu);margin:0}
.foot{display:flex;align-items:center;gap:18px;padding:9px 16px;background:#ffffff80;border-top:1px solid #0000000f;font-size:10px;font-weight:700;letter-spacing:.08em;color:#4b5266;flex-wrap:wrap}
.foot button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0}
.foot button:disabled{opacity:.45;cursor:default}#midi{color:#2b3a66}#lg{color:var(--cu)}.foot em{margin-left:auto;font-style:normal;opacity:.7}
.cap{max-width:1060px;margin:12px auto 0;text-align:center;font-size:11px;color:var(--cap)}

/* Realistic amplifier head detailing; the original HTML structure, logos and controls remain. */
.amp {
  isolation:isolate;
  transform:translateZ(0);
  border:3px solid rgba(10,13,19,.37);
  outline:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 2px 3px #fff7,inset 0 -5px 6px #0008,0 22px 25px -12px #10152288,
             0 5px 10px #15171c55!important;
}
.amp.a0 {
  border-color:#ad9981;
  background: repeating-linear-gradient(121deg,#ffffff09 0 1px,#25160609 2px 3px,transparent 4px 7px),
    linear-gradient(161deg,#fffdf8 0%,#ece4d8 44%,#cfc0ac 100%);
}
.amp.a1 {
  border-color:#121316;
  background:repeating-linear-gradient(65deg,#ffffff06 0 1px,transparent 1px 5px),
    linear-gradient(125deg,#414043 0,#131318 19%,#27252a 77%,#090b10 100%);
  box-shadow:inset 0 2px 3px #7779,inset 0 -5px 6px #000b,0 26px 30px -13px #0009!important;
}
.amp.a2 {
  border-color:#1e3024;
  background: repeating-linear-gradient(46deg,#0000 0 3px,#c3bc8750 4px 5px,#0000 6px 9px),
    repeating-linear-gradient(-46deg,#0000 0 3px,#0a201d70 4px 5px,#0000 6px 9px),
    linear-gradient(160deg,#45624d,#172b20 62%,#102014);
}
.amp .handle {
  left:36%;right:36%;top:-19px;height:20px;
  border-top:8px solid #16191b;border-right:3px solid #999a90;
  box-shadow:0 -2px 0 #7779,0 1px 3px #000b;
}
.amp .face {
  isolation:isolate;
  border:2px solid rgba(0,0,0,.6);
  border-bottom:3px solid rgba(2,2,2,.45);
  box-shadow:inset 0 0 0 3px #ffffff12,inset 0 4px 11px #0009,
             0 2px 3px #000a;
}
.amp .face svg { display:none; }
.amp .face::before, .amp .face::after {content:"";position:absolute;inset:0;pointer-events:none}
.amp .face::before {z-index:0}
.amp .face::after {z-index:1}
/* SAKURA: cream woven grill, pearlescent skin and warm chrome chassis. */
.a0 .face {
  background: linear-gradient(162deg,#fffdf5,#e3ded1 42%,#c9c5bb 68%,#faf8f0 100%)!important;
}
.a0 .face::before {
  background:
    repeating-linear-gradient(45deg,#81756730 0 1px,transparent 1px 5px),
    repeating-linear-gradient(-45deg,#877c6e29 0 1px,transparent 1px 5px),
    radial-gradient(ellipse 70% 65% at 76% 36%,#f5c7b877,transparent 72%);
  box-shadow:inset 0 0 55px #6f62573c;
}
.a0 .face::after {
  background:linear-gradient(118deg,#fff8,transparent 17% 74%,#54412326),
    radial-gradient(ellipse at 100% 100%,#93765842,transparent 65%);
}
.a0 .strip {
  background: repeating-linear-gradient(0deg,#ffffff58 0 1px,#7a6b5812 1px 2px),
    linear-gradient(92deg,#d9cab8 0,#fbf1df 25%,#eadbc8 78%,#a89a85);
  border-top:2px solid #ae9e88;border-bottom:3px solid #978977;
}
.a0 .amp-plaque {color:#69544b;background:linear-gradient(155deg,#f3e5d0,#c4ad8e);border-color:#bea789;}
/* TAKI: copper-lit tube grille, cast-iron hardware, brushed gunmetal. */
.a1 .face {
  background:radial-gradient(ellipse 43% 78% at 70% 62%,#e37b2e96 0%,#77341866 35%,transparent 83%),
   linear-gradient(122deg,#10141a 5%,#26201c 48%,#05070d 100%)!important;
}
.a1 .face::before {
  background:
    repeating-linear-gradient(38deg,transparent 0 3px,#080b10b8 3px 5px,transparent 5px 9px),
    repeating-linear-gradient(-38deg,transparent 0 3px,#05070a9c 3px 5px,transparent 5px 9px),
    radial-gradient(ellipse 65% 50% at 73% 60%,#fb7c1f7c,transparent 74%);
  box-shadow:inset 0 0 32px #020305eb;
}
.a1 .face::after {
  background:linear-gradient(178deg,#ffffff16,#fff0 18%,#0008 90%),
    repeating-linear-gradient(90deg,transparent 0 18%,#e5731d2b 19% 20%,transparent 21% 25%);
  mix-blend-mode:screen;
}
.a1 .strip {
  background:repeating-linear-gradient(0deg,#fff1 0 1px,#0000 1px 3px),
   linear-gradient(90deg,#34343a 0,#62616b 26%,#393b44 73%,#1b202a 100%);
  border-top:2px solid #141516;border-bottom:3px solid #080c10;
}
.a1 .amp-plaque {color:#e5c290;background:linear-gradient(158deg,#49423a,#1c1b1b);border-color:#907453;}
/* TAKE: deep green lacquered tweed, bronze trim and warm internal bloom. */
.a2 .face {
 background:radial-gradient(ellipse at 65% 76%,#bf803f72,#1a3624 65%,#091a11 100%)!important;
}
.a2 .face::before {
 background:repeating-linear-gradient(47deg,transparent 0 4px,#102817c9 4px 6px,transparent 6px 10px),
 repeating-linear-gradient(-47deg,transparent 0 4px,#8ca06c72 4px 5px,transparent 6px 10px);
 box-shadow:inset 0 0 50px #08120bbd;
}
.a2 .face::after {
 background:radial-gradient(ellipse at 69% 64%,#e7b5574d,transparent 63%),
   linear-gradient(165deg,#e9efdb21,transparent 26% 68%,#07140896);
}
.a2 .strip {
 background:repeating-linear-gradient(0deg,#ffffff10 0 1px,transparent 1px 3px),
   linear-gradient(100deg,#564a2d 0%,#998457 30%,#6b603f 77%,#342f23);
 border-top:2px solid #a08d59;border-bottom:3px solid #3d3924;
}
.a2 .amp-plaque {color:#e1d1a7;background:linear-gradient(165deg,#4c4632,#191a14);border-color:#938058;}
.amp .face .logo {z-index:5;filter:drop-shadow(0 2px 1px #0007);}
.a0 .face .logo {filter:drop-shadow(0 2px 1px #fff8);}
.amp .amp-plaque {
 position:absolute;z-index:5;right:5.6%;top:21%;min-width:106px;
 border:1px solid #888;border-radius:3px;padding:8px 9px;
 font:bold 11px Georgia,serif;text-align:center;letter-spacing:.12em;
 box-shadow:inset 0 1px 2px #fff5,inset 0 -2px 3px #0006,0 2px 5px #0008;
 text-transform:uppercase;
}
.amp .amp-plaque small {display:block;font:700 8px Inter,system-ui,sans-serif;letter-spacing:.24em;margin-top:5px;}
.amp .amp-screw {
 display:block;z-index:5;position:absolute;width:8px;height:8px;border-radius:50%;
 background:radial-gradient(circle at 37% 30%,#faf8e1 0 6%,#96918a 28%,#292a2d 68%,#000 95%);
 box-shadow:0 0 0 1px #0009,0 1px 2px #0009;
}
.amp .amp-screw::after {
 content:"";position:absolute;left:15%;top:44%;width:70%;height:1px;
 background:#151515a6;transform:rotate(-38deg);
}
.amp .screw-tl {top:8px;left:8px}
.amp .screw-tr {top:8px;right:8px}
.amp .screw-bl {bottom:8px;left:8px}
.amp .screw-br {bottom:8px;right:8px}
.amp .strip {
 position:relative;
 box-shadow:inset 0 3px 8px #0004;
 padding:10px 16px 15px;
 border-radius:0 0 11px 11px;
}

const irP=()=>`<div class="ir" id="irz"><div class="eqh"><span>IR LOADER</span><span><button data-t="ir">POWER</button><button id="irl">LOAD IR ↑</button><button id="irx"${IR?'':' disabled'}>CLEAR</button></span></div><div style="margin:5px 0 12px"><select id="irbanklist" aria-label="Factory cabinet and room impulse responses" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #c6c8d1;background:#fff;color:#2b3040;font:600 11px Inter,sans-serif">${bankOptions()}</select></div><canvas id="irw" width="600" height="70"></canvas><div class="irm">${IR?`${esc(IR.name)} · ${IR.dur.toFixed(2)} s · ${IR.sr/1000} kHz · ${IR.ch==1?'MONO':'STEREO'}`:'Drop a WAV or AIFF impulse response here, or press LOAD IR'}</div><div class="row">${K('irlv')}${K('irlo')}${K('irhi')}</div><input type="file" id="irf" accept="audio/*,.wav,.aif,.aiff" hidden></div>`;
function drawIR(){const c=$('#irw');if(!c)return;const g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);g.fillStyle='#c8312b';g.fillRect(0,h/2,w,1);if(!IR)return;IR.peaks.forEach((p,i)=>{const bw=w/IR.peaks.length,a=Math.max(1,p*h*.9);g.fillRect(i*bw,(h-a)/2,Math.max(1,bw-1),a)})}
async function loadIR(f){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const b=await AC.decodeAudioData(await f.arrayBuffer());const d=b.getChannelData(0),n=160,s=Math.floor(d.length/n)||1,pk=[];let mx=0;for(let i=0;i<n;i++){let p=0;for(let j=i*s;j<Math.min(d.length,(i+1)*s);j++)p=Math.max(p,Math.abs(d[j]));pk.push(p);mx=Math.max(mx,p)}IR={name:f.name.replace(/\.[^.]+$/,''),dur:b.duration,sr:b.sampleRate,ch:b.numberOfChannels,peaks:pk.map(p=>p/(mx||1))};S.on.ir=true;refreshIR()}catch(e){const m=$('.irm');if(m)m.textContent='Could not read that file. Try a WAV or AIFF impulse response.'}}
const eqV=()=>`<div class="eq"><div class="eqh"><span>9-BAND GRAPHIC EQ</span><span><button data-t="eq">POWER</button><button id="eqr">RESET</button></span></div><div class="bands">${F.map((f,i)=>`<label><output data-o="e${i}"></output><input type="range" min="-12" max="12" step="0.1" data-e="${i}" aria-label="${f}"><span>${f}</span></label>`).join('')}</div></div>`;
const pedV=ids=>`<div class="peds">${ids.map(i=>`<div class="ped p${i}"><div class="pk">${PED[i][2].map((_,j)=>K(`p${i}_${j}`)).join('')}</div><h4>${PED[i][0]}</h4><small>${PED[i][1]}</small><button class="fs" data-t="p${i}" aria-label="${PED[i][0]} on/off"></button><i class="led"></i></div>`).join('')}</div>`;
function view(){$$('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab==T));
const y=scrollY;$('#view').innerHTML=({amp:ampV,cab:cabV,eq:eqV,pre:()=>pedV([0,1,2]),post:()=>pedV([3,4])})[T]();sync();if(T=='cab')drawIR();scrollTo(0,y);$('#ttl').textContent='SishhinDSP · '+AMPS[S.amp][0]}
function sync(){$$('.knob').forEach(k=>{const key=k.dataset.k,[mn,mx]=R[key],v=S.p[key];k.style.setProperty('--a',(-135+270*(v-mn)/(mx-mn))+'deg');k.setAttribute('aria-valuenow',v.toFixed(1));k.setAttribute('aria-label',R[key][4])});
$$('[data-o]').forEach(o=>{const k=o.dataset.o,[,,u,d]=R[k],v=S.p[k];o.textContent=/pan$/.test(k)&&Math.abs(v)<.005?'C':v.toFixed(d)+(u?' '+u:'')});
$$('[data-mic]').forEach(el=>el.style.cssText=micCss(el.dataset.mic));
$$('[data-e]').forEach(r=>r.value=S.p['e'+r.dataset.e]);
$$('[data-t]').forEach(t=>{const k=t.dataset.t;if(k=='mode')t.dataset.m=S.mode;else t.classList.toggle('on',!!S.on[k])})}
function set(k,v){const[mn,mx,,d]=R[k];v=Math.min(mx,Math.max(mn,v));S.p[k]=d?v:Math.round(v);sync()}
function build(){$('#ps').innerHTML='<optgroup label="Factory">'+FAC.map((p,i)=>`<option value="${i}">${String(i+1).padStart(3,'0')} · ${esc(p.name)}</option>`).join('')+'</optgroup>'+(US.length?'<optgroup label="User">'+US.map((p,i)=>`<option value="${72+i}">U${i+1} · ${esc(p.name)}</option>`).join('')+'</optgroup>':'')}
function go(i){const s=clone(L()[i].s);cur=i;S=fresh();Object.assign(S,s);S.p={...DEF,...s.p};S.on={...fresh().on,...s.on};view();$('#ps').value=i}
document.addEventListener('pointerdown',e=>{const k=e.target.closest('.knob');if(!k)return;e.preventDefault();k.focus();k.setPointerCapture(e.pointerId);const key=k.dataset.k,[mn,mx]=R[key],y0=e.clientY,v0=S.p[key];
const mv=ev=>set(key,v0+(y0-ev.clientY)/160*(mx-mn)),up=()=>{k.removeEventListener('pointermove',mv);k.removeEventListener('pointerup',up)};k.addEventListener('pointermove',mv);k.addEventListener('pointerup',up)});
document.addEventListener('keydown',e=>{const k=e.target.closest&&e.target.closest('.knob');if(k&&/^Arrow/.test(e.key)){e.preventDefault();const key=k.dataset.k,[mn,mx]=R[key];set(key,S.p[key]+(/Up|Right/.test(e.key)?1:-1)*(mx-mn)/50)}});
document.addEventListener('dblclick',e=>{const k=e.target.closest('.knob');if(k)set(k.dataset.k,DEF[k.dataset.k])});
document.addEventListener('input',e=>{const r=e.target.dataset&&e.target.dataset.e;if(r!=null)set('e'+r,+e.target.value)});
document.addEventListener('change',e=>{if(e.target.id=='ps')go(+e.target.value);if(e.target.id=='irf'&&e.target.files[0])loadIR(e.target.files[0]);if(e.target.dataset.ms)S['mic'+e.target.dataset.ms]=+e.target.value});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#irz'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#irz')){e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadIR(f)}});
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
if(x=g('[data-tab]')){T=x.dataset.tab;view()}
else if(x=g('[data-amp]')){S.amp=+x.dataset.amp;view()}
else if(x=g('[data-cab]')){S.cab=+x.dataset.cab;view()}
else if(x=g('[data-t]')){const t=x.dataset.t;if(t=='mode')S.mode=S.mode=='mono'?'stereo':'mono';else S.on[t]=!S.on[t];sync()}
else if(x=g('[data-mp]')){const[m,d]=x.dataset.mp.split(',');S['mic'+m]=(S['mic'+m]+ +d+MICS.length)%MICS.length;$(`[data-ms="${m}"]`).value=S['mic'+m]}
else if(g('#irl'))$('#irf').click()
else if(g('#irx')){IR=null;S.on.ir=false;refreshIR()}
else if(g('#eqr')){for(let i=0;i<9;i++)S.p['e'+i]=0;sync()}
else if(g('#pv'))go((cur+L().length-1)%L().length)
else if(g('#nx'))go((cur+1)%L().length)
else if(g('#sa')){const n=$('#nm');n.hidden=false;n.focus()}
else if(g('#sv')){if(cur>=72){US[cur-72].s=clone(S);store()}else $('#sa').click()}
else if(g('#dl')){if(cur>=72){US.splice(cur-72,1);store();build();go(0)}}
else if(g('#lg'))$('#lf').click()});
$('#nm').addEventListener('keydown',e=>{const n=e.target;if(e.key=='Escape'){n.hidden=true;n.value=''}
if(e.key=='Enter'&&n.value.trim()){US.push({name:n.value.trim(),s:clone(S)});store();build();go(FAC.length+US.length-1);n.hidden=true;n.value=''}});
$('#lf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{LOGO=r.result;try{localStorage.setItem('sdsp-logo',LOGO)}catch(x){}view()};r.readAsDataURL(f)});
$('#midi').addEventListener('click',async()=>{try{const a=await navigator.requestMIDIAccess();a.inputs.forEach(i=>i.onmidimessage=m=>{if((m.data[0]&240)==192)go(m.data[1]%L().length)});$('#ms').textContent=a.inputs.size+' MIDI IN · PROGRAM CHANGE 0–71'}catch(x){$('#ms').textContent='MIDI NOT AVAILABLE HERE'}});
build();go(0);
</script><script>
// JUCE plugin UI: disable browser context menus, image dragging and text-selection
// shortcuts. Knob dragging, preset menus, IR file import and keyboard arrows still work.
document.addEventListener('contextmenu', function (event) {
  event.preventDefault();
  event.stopImmediatePropagation();
  return false;
}, true);
document.addEventListener('dragstart', function (event) {
  if (event.target.closest && event.target.closest('img, svg, .face, .amp, .logo')) {
    event.preventDefault();
  }
}, true);
</script><script src="bridge.js"></script></body></html>
